<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7cc95a">
<title>Barnyard Parade</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐷</text></svg>">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div id="app">
  <header id="top">
    <button id="btn-settings" class="round" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.9 4.9-1.9.3a7 7 0 0 1-.8 1.9l1.1 1.6-1.6 1.6-1.6-1.1a7 7 0 0 1-1.9.8l-.3 1.9h-2.3l-.3-1.9a7 7 0 0 1-1.9-.8l-1.6 1.1-1.6-1.6 1.1-1.6a7 7 0 0 1-.8-1.9l-1.9-.3v-2.3l1.9-.3a7 7 0 0 1 .8-1.9L4.3 6.6l1.6-1.6 1.6 1.1a7 7 0 0 1 1.9-.8l.3-1.9h2.3l.3 1.9a7 7 0 0 1 1.9.8l1.6-1.1 1.6 1.6-1.1 1.6a7 7 0 0 1 .8 1.9l1.9.3z" fill="#fff"/></svg></button>
    <div id="banner"><span id="lvl-text">Level 1</span></div>
    <button id="btn-restart" class="round" aria-label="Restart level"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="#fff"/></svg></button>
  </header>
  <div id="stage"><canvas id="board"></canvas>
    <div id="cap" title="Animals parading right now"><span id="cap-text">0/16</span></div>
    <div id="hint" class="hidden"></div>
    <div id="loading"><div class="ld-box"><div class="ld-title">Building the farm...</div><div class="ld-bar"><i id="ld-fill"></i></div></div></div>
  </div>
  <footer id="bottom">
    <button class="pw" data-pw="redo" aria-label="Redo"><svg viewBox="0 0 48 48"><path d="M24 10a14 14 0 1 1-13.6 17.3" fill="none" stroke="#2f8fe6" stroke-width="6" stroke-linecap="round"/><path d="M6 13l10 1-6 8z" fill="#2f8fe6"/></svg><span class="cnt">0</span><span class="lbl">Redo</span></button>
    <button class="pw" data-pw="shuffle" aria-label="Shuffle colors"><svg viewBox="0 0 48 48"><path d="M6 14h8c8 0 12 20 20 20h6M6 34h8c8 0 12-20 20-20h6" fill="none" stroke="#c04ad8" stroke-width="5" stroke-linecap="round"/><path d="M36 8l7 6-7 6zM36 28l7 6-7 6z" fill="#c04ad8"/></svg><span class="cnt">0</span><span class="lbl">Shuffle</span></button>
    <button class="pw" data-pw="plus2" aria-label="Two more on the track"><svg viewBox="0 0 48 48"><path d="M6 14h30l8 10-8 10H6z" fill="#ffb627" stroke="#c87a00" stroke-width="2.5" stroke-linejoin="round"/><text x="21" y="31" text-anchor="middle" font-size="17" font-weight="900" fill="#fff" font-family="system-ui,sans-serif">+2</text></svg><span class="cnt">0</span><span class="lbl">+2 Track</span></button>
    <button class="pw" data-pw="magnet" aria-label="Magnet"><svg viewBox="0 0 48 48"><path d="M10 8v16a14 14 0 0 0 28 0V8h-9v16a5 5 0 0 1-10 0V8z" fill="#ef4150"/><path d="M10 8h9v7h-9zM29 8h9v7h-9z" fill="#dfe6ee"/></svg><span class="cnt">0</span><span class="lbl">Magnet</span></button>
    <button class="pw" data-pw="barn" aria-label="Extra barn"><svg viewBox="0 0 48 48"><path d="M6 22L24 8l18 14v18H6z" fill="#d8453b" stroke="#8e2a22" stroke-width="2.5" stroke-linejoin="round"/><rect x="17" y="26" width="14" height="14" fill="#fff3d6" stroke="#8e2a22" stroke-width="2"/><path d="M17 26l14 14M31 26L17 40" stroke="#8e2a22" stroke-width="2"/></svg><span class="cnt">0</span><span class="lbl">Barn +4</span></button>
  </footer>
</div>

<div id="toast" class="hidden"></div>

<div id="modal" class="hidden"><div class="panel"><h2 id="m-title"></h2><div id="m-body"></div><div id="m-buttons"></div></div></div>

<div id="map" class="hidden">
  <div id="map-head"><button id="map-close" class="round" aria-label="Back">✕</button><h2 data-name></h2><div id="map-bank"></div></div>
  <div id="map-scroll"><div id="map-nodes"></div></div>
  <div id="map-foot"><button id="map-play" class="big">Play</button></div>
</div>

<script src="config.js?v=2"></script>
<script src="game.js?v=2"></script>
<script src="art.js?v=2"></script>
<script src="audio.js?v=2"></script>
<script src="main.js?v=2"></script>
</body>
</html>
